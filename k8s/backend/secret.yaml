apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: ticket-booking
type: Opaque
stringData:
  # WARNING: Change these default values before deploying to production!
  # DB_PASSWORD should match the MySQL root password
  # JWT_SECRET should be a cryptographically secure random string (min 32 chars)
  DB_PASSWORD: "password"
  JWT_SECRET: "your-secret-key-change-in-production"
